    const top=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,1.3,20),tm);top.position.y=2.05;top.castShadow=true;head.add(top);const band=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.22,20),mat(0xc23a3a));band.position.y=1.55;head.add(band)}

    const br=rb(.2,.05,.05,gm,.02,.74);br.position.z=.67;head.add(br)}

    if(sl>0){g.add(rb(.98,sl,1,o.dress?mat(o.dress):shirt,.1,-sl/2))}g.add(rb(.96,2-sl,.98,skin,.1,-sl-(2-sl)/2));body.add(g);return g};

// poses

const town=new THREE.Group();scene.add(town);

[-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.PlaneGeometry(.25,420),mat(0xffffff));e.rotation.x=-Math.PI/2;e.position.set(s*4.6,.05,-180);town.add(e);

const houseStyles=[{w:0xf4ece0,r:0x3b6f4a,t:'side'},{w:0xbfd9f2,r:0x34507a,t:'side'},{w:0xc5603f,r:0x5a3a2a,t:'brick'},{w:0xf7d98a,r:0x8a4a32,t:'side'},{w:0xf2b8c6,r:0x6a3a5a,t:'side'},{w:0xb7dcb0,r:0x8a3a32,t:'side'},{w:0xe9e4f5,r:0x4a4a8a,t:'side'}];
const TEX={};const tex=(k,f)=>TEX[k]||(TEX[k]=f());

function house(x,z,face,st,opt={}){

// stuck spots: roofs, trees, lamps, chimneys
const stuckSpots=[];
function computeStuck(){const out=[];houses.slice(0,10).forEach((h,i)=>{const p=h.position;out.push({x:p.x*.98,y:(i%2?9.6:9.4),z:p.z+(i%3-1)*1.2,ry:p.x>0?-Math.PI/2:Math.PI/2,kind:'roof'})});
  trees.slice(0,8).forEach(t=>out.push({x:t.position.x,y:4.6,z:t.position.z,ry:0,kind:'tree'}));
  lamps.slice(0,6).forEach(l=>out.push({x:l.position.x,y:5.2,z:l.position.z,ry:0,kind:'lamp'}));return out}

// ---------- shot helpers ----------

let T=0;
const SH={

    place(baker,fx-.8,lerp(5.5,1.5,k),hp.z+1,-Math.PI/2);baker.lLeg.visible=baker.rLeg.visible=true;pose(baker,P.climb(t));setFace(baker,'happy');

  end(t,k){sunAt(0,0,-14);const z=-6-t*0;place(leo,0,0,lerp(-2,-0.5,k),0);pose(leo,P.walk(t,6.5));setFace(leo,'happy');
    const walkers=[baker,teacher,mayor,priest,...crowd.slice(0,12)];walkers.forEach((c,i)=>{const col=(i%4)-1.5,row=Math.floor(i/4)+1;
      c.springs=false;c.lLeg.visible=c.rLeg.visible=true;[c.lLeg,c.rLeg].forEach(l=>l.userData.spring&&(l.userData.spring.visible=false));
      place(c,col*2.8,0,lerp(-2,-0.5,k)-row*3.6,0);pose(c,P.walk(t,6.5,i));setFace(c,'happy')});
    cam(L(V(1,5.2,13),V(.5,5.4,11),k),V(0,4,-4),50)},

    cam(L(V(1202.5,3,10),V(1202,3.4,8.6),k),V(1200.2,3+dog.lift.position.y*.6,0),46)},
  boing_dogend(t,k){SH.dogend(t,1)},
};
function restore(){[baker,teacher,mayor,priest,...crowd].forEach(c=>{c.lLeg.visible=c.rLeg.visible=true;if(c.lLeg.userData.spring){c.springs=true;c.lLeg.userData.spring.visible=c.rLeg.userData.spring.visible=true}})}

// ---------- captions ----------
const capEl=document.getElementById('cap'),fade=document.getElementById('fade');
function caption(t){let cur=null;for(const w of window.WORDS)if(w.t<=t)cur=w;
  if(!cur||!cur.w){capEl.textContent='';return}capEl.textContent=cur.w;capEl.className=cur.big?'big':'';
  const p=t-cur.t;capEl.style.transform=cur.big?`scale(${1+.6*Math.exp(-p*12)*Math.cos(p*30)}) rotate(${Math.sin(cur.t*5)*7}deg)`:`scale(${1+.1*Math.exp(-p*18)})`}
window.renderAt=(t)=>{T=t;hideAll();restore();let s=window.SHOTS.find(s=>t>=s.s&&t<s.e)||window.SHOTS[t<1?0:window.SHOTS.length-1];
  const k=clamp((t-s.s)/(s.e-s.s));SH[s.id](t,k,s.e-s.s);caption(t);
  fade.style.opacity=t<.15?1-t/.15:(t>window.END-.25?clamp((t-(window.END-.25))/.25):0);composer.render()};
window.ready=true;renderAt(0.5);
