<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Render</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
  // Página usada só pelo scripts/render-demos.mjs: desenha um quadro de cada vez, sob demanda.
  import { DEMOS, desenhar, duracao, FPS } from "./js/demos.js";
  const q = new URLSearchParams(location.search);
  const demo = DEMOS[q.get("demo")], W = +q.get("w"), H = +q.get("h");
  const c = document.getElementById("c"); c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  await document.fonts.load('40px "Lilita One"');
  window.totalQuadros = Math.ceil(duracao(demo) * FPS);
  window.quadro = (f) => desenhar(ctx, W, H, demo, f);
  window.pronto = true;
</script></body></html>
